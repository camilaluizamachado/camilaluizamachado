name: Generate Datas
on:
  schedule:
    - cron: "0 0 * * *"   # ← corrigido: "0 */24 * * *" não funciona como esperado
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest

    permissions:
      contents: write       # ← adicionado: sem isso, falha ao salvar na branch output

    steps:
      - name: Generate snake game
        uses: Platane/snk@v3
        with:
          github_user_name: camilaluizamachado
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # ← adicionado aqui também

      - name: Push changes
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
